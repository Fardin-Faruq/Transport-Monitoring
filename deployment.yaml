apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transport
  template:
    metadata:
      labels:
        app: transport
    spec:
      containers:
      - name: transport
        image: fardinfaruq/transport:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: transport-service
spec:
  type: NodePort
  selector:
    app: transport
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
